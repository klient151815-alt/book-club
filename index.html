<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Выбор книги клуба 📚</title>
    <style>
        :root {
            --primary: #4a374a;
            --accent: #e74c3c;
            --success: #2ecc71;
            --bg: #f8f9fa;
            --panel-width: 320px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ЛЕВАЯ СТОРОНА: Книги */
        .left-side {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            height: 100%;
            background-color: #fff;
        }
        h1 { color: var(--primary); margin: 0 0 20px 0; font-size: 24px; text-align: center; }
        
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            width: 100%;
        }
        .book-card {
            background: #fff;
            border: 1px solid #e1e8ed;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
        }
        .book-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 4px;
        }
        .book-title {
            margin-top: 6px;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .book-card.crossed {
            opacity: 0.2;
            filter: grayscale(100%);
        }
        .book-card.crossed::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 48%, var(--accent) 49%, var(--accent) 51%, transparent 52%),
                        linear-gradient(-45deg, transparent 48%, var(--accent) 49%, var(--accent) 51%, transparent 52%);
        }

        /* ПРАВАЯ СТОРОНА: Панель цифр */
        .right-side {
            width: var(--panel-width);
            background-color: #f1f2f6;
            border-left: 2px solid #dcdde1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
        }
        .right-side h3 { color: #555; margin-top: 0; text-align: center; font-size: 16px; }
        
        .buttons-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
        }
        .num-btn {
            background-color: white;
            border: 2px solid var(--primary);
            color: var(--primary);
            font-size: 20px;
            font-weight: bold;
            aspect-ratio: 1;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .num-btn:hover {
            background-color: var(--primary);
            color: white;
            transform: scale(1.05);
        }
        .num-btn.disabled {
            background-color: #cbd5e1;
            border-color: #94a3b8;
            color: #64748b;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* МОДАЛЬНЫЕ ОКНА */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease forwards;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-book-img {
            width: 140px;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            margin-bottom: 15px;
        }
        .modal-book-title { font-size: 18px; font-weight: bold; color: #222; margin-bottom: 15px; }
        
        .recommender-block {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }
        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
        }
        .recommender-info { font-size: 13px; color: #555; }
        .recommender-info span { display: block; font-weight: bold; color: #000; font-size: 14px; }
        
        .action-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .action-btn:hover { background-color: #c0392b; }

        .winner-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .winner-card img { width: 180px; height: 260px; object-fit: cover; border-radius: 8px; }
        .winner-title { font-size: 24px; color: var(--success); font-weight: bold; margin-bottom: 15px; }
        .winner-name { font-size: 20px; font-weight: bold; margin-top: 10px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <!-- ЛЕВАЯ ЧАСТЬ: Сетка из 15 книг -->
    <div class="left-side">
        <h1>Выбор книги месяца 📚</h1>
        <div class="books-grid" id="booksGrid"></div>
    </div>

    <!-- ПРАВАЯ ЧАСТЬ: Цифры -->
    <div class="right-side">
        <h3>Исключить цифру:</h3>
        <div class="buttons-grid" id="buttonsGrid"></div>
    </div>

    <!-- ОКНО ПРЕДПРОСМОТРА КНИГИ ПЕРЕД ВЫЧЕРКИВАНИЕМ -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-content">
            <img class="modal-book-img" id="modalImg" src="" alt="Обложка">
            <div class="modal-book-title" id="modalTitle">Название книги</div>
            
            <div class="recommender-block">
                <img class="user-avatar" id="modalAvatar" src="" alt="Фото">
                <div class="recommender-info">
                    Книгу порекомендовал(а):
                    <span id="modalUserName">Имя Участника</span>
                </div>
            </div>
            
            <button class="action-btn" id="confirmCrossBtn">❌ Вычеркнуть книгу</button>
        </div>
    </div>

    <!-- ЭКРАН ПОБЕДИТЕЛЯ -->
    <div class="modal-overlay" id="winnerModal">
        <div class="winner-card">
            <div class="winner-title">🎉 Книга следующего месяца!</div>
            <img id="winnerImg" src="" alt="Обложка">
            <div class="winner-name" id="winnerTitle">Название победителя</div>
        </div>
    </div>

<script>
        // БАЗА ДАННЫХ ВАШЕГО КЛУБА (Заполните своими данными)
        // Замените "book1.jpg" на реальные файлы обложек, а "user1.jpg" — на фото участников.
        const bookData = {
            1:  { title: "Королевство Шипов и Роз",    img: "Book1.jfif", user: "Даша", avatar: "user3.png" },
            2:  { title: "Господин Прокурор",          img: "Book2.jpg",  user: "Даша", avatar: "user3.png" },
            3:  { title: "Когда родилась луна",        img: "Book3.webp", user: "Даша", avatar: "user3.png" },
            4:  { title: "На крыльях крови",           img: "Book4.jpg",  user: "Даша", avatar: "user3.png" },
            5:  { title: "Ртуть",                      img: "Book5.jpg",  user: "Даша", avatar: "user3.png" },
            6:  { title: "Девушка и призрак",          img: "Book6.jpg",  user: "Вика", avatar: "user1.jpg" },
            7:  { title: "На зло папе куплю маму",     img: "Book7.jpg",  user: "Вика", avatar: "user1.jpg" },
            8:  { title: "Черная кошка для генерала",  img: "Book8.jfif", user: "Вика", avatar: "user1.jpg" },
            9:  { title: "Шлейф сандала",              img: "Book9.jfif", user: "Вика", avatar: "user1.jpg" },
            10: { title: "Верные враги",               img: "Book10.webp", user: "Вика", avatar: "user1.jpg" },
            11: { title: "Боевой абибас",              img: "Book11.jfif", user: "Лена", avatar: "user2.jpg" },
            12: { title: "Доминиканцы из Москоу-сити", img: "Book12.jfif", user: "Лена", avatar: "user2.jpg" },
            13: { title: "Тихо из дворов",             img: "Book13.jpg", user: "Лена", avatar: "user2.jpg" },
            14: { title: "40 по Валентину",            img: "Book14.jpg", user: "Лена", avatar: "user2.jpg" },
            15: { title: "Переводчик с четкого",       img: "Book15.jpg", user: "Лена", avatar: "user2.jpg" }
        };

        // ТАЙНАЯ СВЯЗЬ ЦИФР И КНИГ (Случайное распределение)
        // Цифра на кнопке : ID книги, которая откроется и будет зачеркнута
        const relations = {
            1: 14, 2: 6, 3: 11, 4: 2, 5: 15, 6: 8, 7: 1, 8: 10, 9: 3, 10: 13, 11: 5, 12: 7, 13: 9, 14: 4, 15: 12
        };

        let crossedCount = 0;
        const totalBooks = 15;
        let currentSelectedBookId = null;
        let currentSelectedButton = null;

        // Генерируем карточки книг на странице
        const booksGrid = document.getElementById('booksGrid');
        for (let i = 1; i <= totalBooks; i++) {
            booksGrid.innerHTML += `
                <div class="book-card" id="book-${i}"> 
                    <img src="${bookData[i].img}" onerror="this.src='https://placehold.co{i}'"> 
                    <div class="book-title" title="${bookData[i].title}">${bookData[i].title}</div> 
                </div>`;
        }

        // Генерируем кнопки с цифрами
        const buttonsGrid = document.getElementById('buttonsGrid');
        for (let i = 1; i <= totalBooks; i++) {
            buttonsGrid.innerHTML += `<button class="num-btn" id="btn-${i}" onclick="openPreview(${i}, this)">${i}</button>`;
        }

        // 1. Открытие модального окна предпросмотра
        function openPreview(num, btn) {
            if (btn.classList.contains('disabled')) return;
            currentSelectedBookId = relations[num];
            currentSelectedButton = btn;
            const data = bookData[currentSelectedBookId];
            
            // Заполняем данными модальное окно
            document.getElementById('modalImg').src = data.img;
            // Резервная заглушка, если картинки нет на диске
            document.getElementById('modalImg').onerror = function() { 
                this.src = `https://placehold.co{currentSelectedBookId}`; 
            };
            
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalUserName').innerText = data.user;
            document.getElementById('modalAvatar').src = data.avatar;
            document.getElementById('modalAvatar').onerror = function() { 
                this.src = 'https://placehold.co👤'; 
            };
            
            // Показываем окно
            document.getElementById('previewModal').style.display = 'flex';
        }

        // 2. Подтверждение вычеркивания внутри модального окна
        document.getElementById('confirmCrossBtn').onclick = function() {
            // Закрываем окно предпросмотра
            document.getElementById('previewModal').style.display = 'none';
            // Вычеркиваем карточку книги
            const bookCard = document.getElementById(`book-${currentSelectedBookId}`);
            if (bookCard && !bookCard.classList.contains('crossed')) {
                bookCard.classList.add('crossed');
                currentSelectedButton.classList.add('disabled');
                crossedCount++;
                // Если осталась всего 1 незачеркнутая книга — выводим победителя
                if (crossedCount === totalBooks - 1) {
                    setTimeout(showWinner, 800);
                }
            }
        };

        // 3. Финал: показ победителя
        function showWinner() {
            for (let i = 1; i <= totalBooks; i++) {
                const card = document.getElementById(`book-${i}`);
                if (!card.classList.contains('crossed')) {
                    const finalData = bookData[i];
                    document.getElementById('winnerImg').src = finalData.img;
                    document.getElementById('winnerImg').onerror = function() { 
                        this.src = `https://placehold.co{finalData.title}`; 
                    };
                    document.getElementById('winnerTitle').innerText = finalData.title;
                    document.getElementById('winnerModal').style.display = 'flex';
                    break;
                }
            }
        }
    </script>
</body>
</html>
